name: Apply release source

on:
  push:
    branches: [main]
    paths: [gyopo-source-release.zip]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release source
        run: |
          mkdir /tmp/gyopo-release
          unzip -q gyopo-source-release.zip -d /tmp/gyopo-release
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name gyopo-source-release.zip -exec rm -rf {} +
          cp -a /tmp/gyopo-release/. .
          rm -f gyopo-source-release.zip
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Apply authoritative Badball release source"
          git push

